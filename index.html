
<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City4All XR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }
    header { padding: 18px 24px; }
    h1 { color: #54e0b5; margin-bottom: 8px; }
    p { color: #cbd5e1; }
    #map { width: 100%; height: 70vh; min-height: 400px; }
  </style>
</head>
<body>
  <header>
    <h1>City4All XR</h1>
    <p>Discover a more accessible world.</p>
    <p>Explore accessible places on the map.</p>
  </header>

  <div id="map"></div>

  <script>
    function initMap() {
      const map = new google.maps.Map(
        document.getElementById("map"),
        {
          center: { lat: 37.929, lng: 23.750 },
          zoom: 13,
          mapTypeControl: true,
          streetViewControl: true,
          fullscreenControl: true
        }
      );
    }
    window.initMap = initMap;
  </script>

  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBH7dMOo-XGOHXBNqbw6KcjxA84pNyVmQA&callback=initMap&loading=async">
  </script>
</body>
</html>
