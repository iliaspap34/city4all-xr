
<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City4All XR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }
    header { padding: 16px 22px; }
    h1 { color: #54e0b5; margin: 0 0 8px; }
    #status { color: #cbd5e1; }
    #map { width: 100%; height: 75vh; min-height: 400px; }
  </style>
</head>
<body>
  <header>
    <h1>City4All XR</h1>
    <p>Discover a more accessible world.</p>
    <p id="status">Loading accessible locations...</p>
  </header>

  <div id="map"></div>

  <script>
    let map;

    async function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 37.929, lng: 23.750 },
        zoom: 12,
        mapTypeControl: true,
        streetViewControl: true,
        fullscreenControl: true
      });

      const status = document.getElementById("status");
      const queryUrl =
        "https://services4.arcgis.com/D1oWZQPmnyTvHNmk/arcgis/rest/services/survey123_d2ca09a7753a4dca8a8a5e3c84c8e862/FeatureServer/0/query" +
        "?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&f=json";

      try {
        const response = await fetch(queryUrl);
        if (!response.ok) throw new Error("ArcGIS request failed");

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const features = data.features || [];

        features.forEach((feature) => {
          const point = feature.geometry;
          if (!point) return;

          const lat = point.y;
          const lng = point.x;
          if (typeof lat !== "number" || typeof lng !== "number") return;

          const marker = new google.maps.Marker({
            position: { lat, lng },
            map,
            title: "City4All accessible location"
          });

          const info = new google.maps.InfoWindow({
            content: "<div><strong>City4All</strong><br>Accessible location</div>"
          });

          marker.addListener("click", () => info.open({ map, anchor: marker }));
        });

        status.textContent =
          "Loaded " + features.length + " locations from City4All.";
      } catch (error) {
        console.error(error);
        status.textContent =
          "Could not load locations. Check ArcGIS access and browser console.";
      }
    }

    window.initMap = initMap;
  </script>

  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBH7dMOo-XGOHXBNqbw6KcjxA84pNyVmQA&callback=initMap&loading=async">
  </script>
</body>
</html>
